[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-forge"
version = "0.4.0"
description = "Local AI scene planning and editable Blender animation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
scene-forge = "scene_forge.cli:main"

[tool.setuptools.packages.find]
include = ["scene_forge*"]
